function pr(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
}

function text(str, x, y, size, color, align) {
  // sans-serif lebih jelas di canvas daripada monospace kecil
  const px = Math.max(11, size | 0);
  ctx.font = "600 " + px + "px \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif";
  ctx.textAlign = align || "left";
  ctx.textBaseline = "top";
  ctx.fillStyle = color;
  // soft shadow for contrast on dark panels
  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  ctx.fillText(str, (x | 0) + 1, (y | 0) + 1);
  ctx.fillStyle = color;
  ctx.fillText(str, x | 0, y | 0);
  ctx.restore();
}

function wrap(str, maxW, size) {
  const px = Math.max(11, size | 0);
  ctx.font = "600 " + px + "px \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif";
  const words = String(str).split(" ");
  const out = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW) {
      if (cur) out.push(cur);
      cur = w;
    } else cur = t;
  }
  if (cur) out.push(cur);
  return out;
}

function drawActor(x, y, who, expr) {
  const L = LOOKS[who];
  const bob = Math.sin(time * 2.2 + (who === "adi" ? 1 : 0)) * 1.2;

  const blink = (Math.sin(time * 3.1 + (who === "adi" ? 2 : 0)) > 0.92);

  pr(x - 18, y + 6, 36, 6, "rgba(0,0,0,0.28)");

  pr(x - 11, yy - 6, 9, 16, L.pants);
  pr(x + 2, yy - 6, 9, 16, L.pants);
  pr(x - 12, yy + 8, 11, 4, L.shoe);
  pr(x + 1, yy + 8, 11, 4, L.shoe);

  pr(x - 15, yy - 30, 30, 26, L.shirt);
  pr(x - 15, yy - 30, 30, 3, L.shirtD);

  if (who === "adi") {
    pr(x - 4, yy - 30, 8, 4, "#e8e8e8");
    pr(x - 2, yy - 28, 4, 18, "#8a1a1a");
    pr(x - 3, yy - 28, 6, 3, "#c03030");
  } else {
    pr(x - 7, yy - 30, 14, 5, L.shirtD);
  }

  const armSwing = Math.sin(time * 2 + (who === "guntur" ? 0 : 1.5)) * 2;
  pr(x - 20, yy - 28 + armSwing * 0.3, 7, 18, L.skin);
  pr(x + 13, yy - 28 - armSwing * 0.3, 7, 18, L.skin);
  pr(x - 20, yy - 28, 7, 5, L.shirt);
  pr(x + 13, yy - 28, 7, 5, L.shirt);

  const hx = x, hy = yy - 30;

  if (who === "adi") {
    pr(hx - 15, hy - 40, 30, 16, L.hair);
    pr(hx - 17, hy - 32, 34, 10, L.hair);
    pr(hx - 17, hy - 26, 5, 7, "#5a5a60");
    pr(hx + 12, hy - 26, 5, 7, "#5a5a60");
  } else {
    pr(hx - 15, hy - 42, 30, 14, L.hair);
    pr(hx - 17, hy - 34, 34, 12, L.hair);
    pr(hx - 14, hy - 44, 10, 6, L.hairH);
    pr(hx + 4, hy - 44, 10, 6, L.hairH);
  }

  pr(hx - 13, hy - 32, 26, 24, L.skin);
  pr(hx - 13, hy - 32, 26, 3, L.skinD);

  if (blink) {
    pr(hx - 8, hy - 24, 5, 2, "#1a120e");
    pr(hx + 3, hy - 24, 5, 2, "#1a120e");
  } else {
    pr(hx - 8, hy - 25, 5, 5, "#f4efe4");
    pr(hx + 3, hy - 25, 5, 5, "#f4efe4");
    pr(hx - 7, hy - 24, 3, 3, "#1a120e");
    pr(hx + 4, hy - 24, 3, 3, "#1a120e");
  }

  if (expr === "worry") {
    pr(hx - 9, hy - 30, 6, 2, L.hair);
    pr(hx + 3, hy - 30, 6, 2, L.hair);
  } else if (expr === "smile" || expr === "smirk") {
    pr(hx - 9, hy - 29, 5, 2, L.hair);
    pr(hx + 4, hy - 29, 5, 2, L.hair);
  } else {
    pr(hx - 8, hy - 29, 5, 2, L.hair);
    pr(hx + 3, hy - 29, 5, 2, L.hair);
  }

  pr(hx - 1, hy - 18, 2, 4, L.skinD);

  const talk = (phase === "talk" && LINES[lineI] && LINES[lineI].who === who && charI < (LINES[lineI].t || "").length);
  const mouthOpen = talk && ((time * 10) | 0) % 2 === 0;

  if (mouthOpen) {
    pr(hx - 3, hy - 12, 6, 4, "#6a2a28");
  } else if (expr === "smile") {
    pr(hx - 5, hy - 12, 10, 2, "#9a4a42");
    pr(hx - 6, hy - 13, 2, 2, "#9a4a42");
    pr(hx + 4, hy - 13, 2, 2, "#9a4a42");

    pr(hx - 2, hy - 12, 8, 2, "#9a4a42");
    pr(hx + 5, hy - 13, 2, 2, "#9a4a42");

    pr(hx - 3, hy - 11, 6, 2, "#9a4a42");

  const col = who === "adi" ? "#7ec8c0" : "#e0c888";
  text(label, x, y + 16, 10, col, "center");
}

  pr(x - 4, y - 6, 5, 5, "#f4efe4");
  pr(x - 2, y - 40, 4, 16, "#f0e8d8");
  pr(x - 3, y - 42, 6, 3, "#c04040");
  const fl = Math.sin(time * 14) * 2;
  pr(x - 1, y - 50 + fl, 3, 7, "#f0c040");
  pr(x, y - 54 + fl, 2, 4, "#fff0c0");
}

function drawDialogBox() {
  const line = LINES[lineI];
  if (!line) return;
  const boxY = H - 156;
  const border = line.who === "adi" ? "#7ec8c0" : line.who === "guntur" ? "#e0c888" : "#a89880";

  pr(14, boxY, W - 28, 138, "rgba(8,10,14,0.94)");
  pr(14, boxY, W - 28, 3, border);
  pr(16, boxY + 3, W - 32, 132, "#14181e");

  if (line.who === "narr") {
    const shown = (line.t || "").slice(0, charI);
    if (line.t === "SELAMAT ULANG TAHUN") {
      text(shown, W / 2, boxY + 44, 18, "#e0c888", "center");
    } else {
      const ls = wrap(shown, W - 60, 13);
      ls.forEach((ln, i) => text(ln, W / 2, boxY + 36 + i * 20, 14, "#c8b89a", "center"));
    }
  } else {
    const name = line.who === "adi" ? "PAK ADI" : "GUNTUR KHOIDIR PUTRA";
    const ncol = line.who === "adi" ? "#7ec8c0" : "#e0c888";
    text(name, 30, boxY + 12, 13, ncol, "left");
    const shown = (line.t || "").slice(0, charI);
    const ls = wrap(shown, W - 60, 13);
    ls.forEach((ln, i) => text(ln, 30, boxY + 36 + i * 19, 14, "#f4efe4", "left"));
  }

  if (charI >= (line.t || "").length) {
    if (Math.sin(time * 5) > 0) text("▼", W - 36, boxY + 116, 11, "#a89880", "center");
  }
}

function spawnConfetti() {
  for (let i = 0; i < 55; i++) {
    confetti.push({
      x: Math.random() * W,
      y: -10 - Math.random() * 100,
      vx: (Math.random() - 0.5) * 70,
      vy: 35 + Math.random() * 90,
      c: ["#e0c888", "#7ec8c0", "#c04040", "#f0e8d8", "#70c8e0", "#e0a040"][(Math.random() * 6) | 0],
      w: 3 + Math.random() * 6,
      h: 3 + Math.random() * 5,
    });
  }
}

function drawConfetti(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 28 * dt;
    pr(p.x, p.y, p.w, p.h, p.c);
    if (p.y > H + 20) confetti.splice(i, 1);
  }
}

function drawTitle() {
  pr(36, 180, W - 72, 150, "rgba(8,10,14,0.9)");
  pr(36, 180, W - 72, 3, "#e0c888");
  text("PT ADHI CHANDRA JAYA", W / 2, 198, 11, "#7ec8c0", "center");
  text("UCAPAN KHUSUS", W / 2, 220, 12, "#a89880", "center");
  text("SELAMAT ULANG TAHUN", W / 2, 250, 17, "#f4efe4", "center");
  text("Bapak Novri Adi Chandra", W / 2, 278, 14, "#e0c888", "center");
  text(AGE + " tahun  ·  1979 – 2026", W / 2, 302, 12, "#a89880", "center");
  if (Math.sin(time * 4) > 0) text("ketuk / spasi untuk mulai", W / 2, 370, 12, "#a89880", "center");
}

function drawEndCard() {
  pr(28, 130, W - 56, 320, "rgba(8,10,14,0.94)");
  pr(28, 130, W - 56, 3, "#e0c888");
  text("SELAMAT ULANG TAHUN", W / 2, 156, 17, "#e0c888", "center");
  text("Bapak Novri Adi Chandra", W / 2, 186, 14, "#f4efe4", "center");
  text(AGE + " tahun", W / 2, 216, 22, "#7ec8c0", "center");
  text("1979  →  2026", W / 2, 248, 12, "#a89880", "center");
  text("Semoga sehat, panjang umur,", W / 2, 280, 12, "#d5ebe8", "center");
  text("keluarga dilindungi, usaha diberkahi.", W / 2, 300, 12, "#d5ebe8", "center");
  text("Tahun ini lebih tenang & penuh kebaikan.", W / 2, 320, 12, "#d5ebe8", "center");
  text("Dengan hormat,", W / 2, 356, 11, "#c8b89a", "center");
  text("Guntur Khoidir Putra", W / 2, 378, 13, "#e0c888", "center");
  text("SMK-SMTI Yogyakarta", W / 2, 400, 11, "#a89880", "center");
  text("Anak PKL · PT Adhi Chandra Jaya", W / 2, 420, 11, "#a89880", "center");
}

function advance() {
  if (phase === "intro") {
    phase = "talk"; lineI = 0; charI = 0; hold = 0;
    return;
  }
  if (phase === "talk") {
    const line = LINES[lineI];
    if (!line) return;
    if (charI < line.t.length) { charI = line.t.length; return; }
    lineI++;
    charI = 0; hold = 0;
    if (lineI >= LINES.length) {
      phase = "cake";
      spawnConfetti();
      return;
    }
    if (LINES[lineI] && LINES[lineI].t === "SELAMAT ULANG TAHUN") spawnConfetti();
    return;
  }
  if (phase === "cake") phase = "end";
}

canvas.addEventListener("click", advance);
canvas.addEventListener("touchstart", (e) => { e.preventDefault(); advance(); }, { passive: false });
window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter" || e.key === "e" || e.key === "E") {
    e.preventDefault();
    advance();
  }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  time += dt;

  if (phase === "talk") {
    const line = LINES[lineI];
    if (line && charI < line.t.length) {
      hold += dt;
      if (hold > 0.024) { hold = 0; charI++; }
    }
  }

  ctx.fillStyle = "#07080c";
  ctx.fillRect(0, 0, W, H);

  const line = LINES[lineI];
  const gExpr = (phase === "talk" && line && line.who === "guntur") ? (line.e || "smile") : "smile";
  const aExpr = (phase === "talk" && line && line.who === "adi") ? (line.e || "neutral") : (phase === "end" || phase === "cake" ? "smile" : "neutral");

  if (phase === "intro") {
    drawOffice();
    drawActor(155, 385, "guntur", "smile");
    drawActor(325, 385, "adi", "neutral");
    drawTitle();
  } else if (phase === "talk") {
    drawOffice();
    drawActor(155, 385, "guntur", gExpr);
    drawActor(325, 385, "adi", aExpr);
    if (lineI >= 44) drawCake(240, 335);
    drawDialogBox();
    drawConfetti(dt);
  } else {
    drawOffice();
    drawActor(155, 385, "guntur", "smile");
    drawActor(325, 385, "adi", "smile");
    drawCake(240, 335);
    drawConfetti(dt);
    if (phase === "end") drawEndCard();
    else text("ketuk untuk kartu akhir", W / 2, H - 36, 12, "#a89880", "center");
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.focus();
})();
</script>
</body>
</html>
